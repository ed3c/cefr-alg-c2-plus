name: Verify pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check application, narration, voice lab, and skill contracts
        run: npm run check
      - name: Check Python voice-lab boundaries
        run: python3 scripts/test_voice_lab.py
