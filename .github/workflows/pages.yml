name: Verify and publish English Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check application and learning content
        run: |
          node --check dist/app.js
          node --check dist/lessons.js
          node --check dist/compare.js
          node --check dist/kokoro-worker.js
          node scripts/check.mjs
          node scripts/check-voice-lab.mjs
          python3 scripts/test_voice_lab.py
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
